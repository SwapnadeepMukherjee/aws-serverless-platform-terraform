name: Deploy Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# env:
#   AWS_REGION: ${{ vars.AWS_REGION }}                   # "ap-south-1"
  # ECR_REPOSITORY: my-fastapi-app                       # Your repo name
  # IMAGE_TAG: ${{ github.sha }}                         # Unique commit hash

# Core Security Principle: Minimize GitHub Token Privileges globally permissions:
permissions:
  id-token: write   # REQUIRED for requesting the OIDC JWT
  contents: read    # Required for actions/checkout


jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container:
      image: python:3.11
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install -r requirements.txt
        pip install flake8 pytest pytest-cov checkov
        pip install coverage
    - name: Lint Python (flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Static Analysis (checkov)
      run: checkov -d . --framework terraform --soft-fail
    # - name: Run tests with coverage
    #   run: |
    #     export COVERAGE_PROCESS_START=.coveragerc
    #     pytest --cov=src tests/ --cov-fail-under=80

  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}
      TF_VAR_lambda_role_arn: ${{ secrets.LAMBDA_ROLE_ARN }}
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        role-to-assume: arn:aws:iam::788531719687:role/github-actions-terraform-deploy
        aws-region: ap-south-1

    - uses: actions/setup-node@v4
      with:
        node-version: 24.14.1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Initialize Terraform
      run: terraform init
      working-directory: terraform/env/dev

    - name: Terraform Plan
      run: terraform plan
      working-directory: terraform/env/dev
      
    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: terraform/env/dev

    - name: Debug Repo Structure
      run: |
        echo "Current directory:"
        pwd
        echo "Listing files:"
        ls -R